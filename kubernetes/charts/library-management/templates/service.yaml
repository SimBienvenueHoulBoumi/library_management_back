apiVersion: v1
kind: Service
metadata:
  name: {{ include "library-management.fullname" . }}
  labels:
    {{- include "library-management.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") (kindIs "int" .Values.service.nodePort) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "library-management.selectorLabels" . | nindent 4 }}
