apiVersion: v1
kind: Service
metadata:
  name: {{ include "library-management.fullname" . }}
  labels:
    {{- include "library-management.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ int (.Values.service.nodePort | default 30075) }}
      {{- end }}
  selector:
    {{- include "library-management.selectorLabels" . | nindent 4 }}
